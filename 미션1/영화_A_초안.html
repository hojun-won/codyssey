<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영화 티어리스트</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px;
    font-family: "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", sans-serif;
    background: #1e1f24; color: #f2f2f2;
  }
  h1 { margin: 0 0 6px; font-size: 28px; }
  .guide { margin: 0 0 18px; color: #b8bcc6; font-size: 15px; }
  .toolbar {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    margin-bottom: 18px; padding: 12px; background: #2a2c33; border-radius: 10px;
  }
  .toolbar input {
    padding: 9px 10px; border: 1px solid #454852; border-radius: 6px;
    background: #1e1f24; color: #f2f2f2; font-size: 15px;
  }
  #inTitle { width: 200px; } #inYear { width: 100px; } #inDirector { width: 140px; }
  button {
    padding: 9px 14px; border: 0; border-radius: 6px; cursor: pointer;
    font-size: 15px; font-weight: bold;
  }
  #btnAdd { background: #3b82f6; color: #fff; }
  #btnReset { background: #555a66; color: #fff; margin-left: auto; }
  button:hover { filter: brightness(1.15); }

  .board { border: 1px solid #3a3d46; border-radius: 10px; overflow: hidden; }
  .row { display: flex; min-height: 96px; border-bottom: 1px solid #3a3d46; }
  .row:last-child { border-bottom: 0; }
  .label {
    flex: 0 0 90px; display: flex; align-items: center; justify-content: center;
    font-size: 34px; font-weight: bold; color: #1e1f24;
  }
  .zone {
    flex: 1; display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start;
    padding: 10px; background: #2a2c33; min-height: 96px;
  }
  .zone.over { background: #353946; outline: 2px dashed #8ab4ff; outline-offset: -4px; }

  .unsorted { margin-top: 18px; border: 1px solid #3a3d46; border-radius: 10px; overflow: hidden; }
  .unsorted h2 { margin: 0; padding: 10px 14px; font-size: 17px; background: #33363f; }
  .unsorted .zone { min-height: 120px; }

  .card {
    position: relative; width: 150px; padding: 10px 26px 10px 10px;
    background: #f7f7f9; color: #1e1f24; border-radius: 8px;
    cursor: grab; user-select: none; box-shadow: 0 2px 4px rgba(0,0,0,.35);
  }
  .card:active { cursor: grabbing; }
  .card.dragging { opacity: .4; }
  .card .title { font-weight: bold; font-size: 15px; line-height: 1.3; word-break: keep-all; }
  .card .meta { font-size: 12px; color: #555; margin-top: 4px; }
  .card .del {
    position: absolute; top: 4px; right: 4px; width: 20px; height: 20px; padding: 0;
    border-radius: 50%; background: #e2e4ea; color: #444; font-size: 13px; line-height: 20px;
  }
  .card .del:hover { background: #ef4444; color: #fff; }
  .placeholder {
    width: 150px; min-height: 62px; border: 2px dashed #8ab4ff; border-radius: 8px;
  }
  .msg { color: #fca5a5; font-size: 14px; }
</style>
</head>
<body>

<h1>🎬 영화 티어리스트</h1>
<p class="guide">영화 카드를 마우스로 끌어서 등급 칸에 놓으세요. 같은 칸 안에서도 끌어서 순서를 바꿀 수 있습니다.</p>

<div class="toolbar">
  <input id="inTitle" type="text" placeholder="영화 제목 (필수)">
  <input id="inYear" type="number" placeholder="개봉연도">
  <input id="inDirector" type="text" placeholder="감독">
  <button id="btnAdd">영화 추가</button>
  <span id="msg" class="msg"></span>
  <button id="btnReset">처음으로 되돌리기</button>
</div>

<div class="board" id="board"></div>

<div class="unsorted">
  <h2>미분류</h2>
  <div class="zone" data-tier="미분류"></div>
</div>

<script>
  const STORAGE_KEY = "movieTierList_v1";
  const TIERS = [
    { name: "S", color: "#ff7f7f" },
    { name: "A", color: "#ffbf7f" },
    { name: "B", color: "#ffdf7f" },
    { name: "C", color: "#bfff7f" },
    { name: "D", color: "#7fbfff" }
  ];
  const DEFAULT_MOVIES = [
    { title: "기생충", year: 2019, director: "봉준호" },
    { title: "올드보이", year: 2003, director: "박찬욱" },
    { title: "살인의 추억", year: 2003, director: "봉준호" },
    { title: "괴물", year: 2006, director: "봉준호" },
    { title: "부산행", year: 2016, director: "연상호" },
    { title: "범죄도시", year: 2017, director: "강윤성" },
    { title: "극한직업", year: 2019, director: "이병헌" },
    { title: "헤어질 결심", year: 2022, director: "박찬욱" },
    { title: "서울의 봄", year: 2023, director: "김성수" },
    { title: "파묘", year: 2024, director: "장재현" }
  ];

  // 상태: 각 칸(등급)별 영화 목록
  let state;

  function initialState() {
    const s = { "미분류": [] };
    TIERS.forEach(t => s[t.name] = []);
    DEFAULT_MOVIES.forEach((m, i) => s["미분류"].push({ id: "m" + i, ...m }));
    return s;
  }

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const s = JSON.parse(raw);
        if (s && s["미분류"]) return s;
      }
    } catch (e) {}
    return initialState();
  }

  // 등급 칸 화면 만들기
  const board = document.getElementById("board");
  TIERS.forEach(t => {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `<div class="label" style="background:${t.color}">${t.name}</div>
                     <div class="zone" data-tier="${t.name}"></div>`;
    board.appendChild(row);
  });

  function makeCard(m) {
    const card = document.createElement("div");
    card.className = "card";
    card.draggable = true;
    card.dataset.id = m.id;
    const meta = [m.year, m.director].filter(Boolean).join(" · ");
    card.innerHTML = `<div class="title"></div><div class="meta"></div>
                      <button class="del" title="삭제">×</button>`;
    card.querySelector(".title").textContent = m.title;
    card.querySelector(".meta").textContent = meta;
    card.querySelector(".del").addEventListener("click", () => removeMovie(m.id));
    card.addEventListener("dragstart", e => {
      dragId = m.id;
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", m.id);
      setTimeout(() => card.classList.add("dragging"), 0);
    });
    card.addEventListener("dragend", () => {
      card.classList.remove("dragging");
      clearPlaceholder();
      dragId = null;
    });
    return card;
  }

  function render() {
    document.querySelectorAll(".zone").forEach(zone => {
      zone.innerHTML = "";
      (state[zone.dataset.tier] || []).forEach(m => zone.appendChild(makeCard(m)));
    });
  }

  // ---------- 드래그 앤 드롭 ----------
  let dragId = null;
  const placeholder = document.createElement("div");
  placeholder.className = "placeholder";

  function clearPlaceholder() {
    placeholder.remove();
    document.querySelectorAll(".zone.over").forEach(z => z.classList.remove("over"));
  }

  // 마우스 위치 기준으로 어느 카드 앞에 놓을지 찾기
  function cardAfterPointer(zone, x, y) {
    const cards = [...zone.querySelectorAll(".card:not(.dragging)")];
    for (const c of cards) {
      const r = c.getBoundingClientRect();
      const sameRow = y >= r.top && y <= r.bottom;
      if ((sameRow && x < r.left + r.width / 2) || y < r.top) return c;
    }
    return null;
  }

  document.querySelectorAll(".zone").forEach(zone => {
    zone.addEventListener("dragover", e => {
      if (!dragId) return;
      e.preventDefault();
      document.querySelectorAll(".zone.over").forEach(z => z !== zone && z.classList.remove("over"));
      zone.classList.add("over");
      const after = cardAfterPointer(zone, e.clientX, e.clientY);
      if (after) zone.insertBefore(placeholder, after);
      else zone.appendChild(placeholder);
    });
    zone.addEventListener("dragleave", e => {
      if (!zone.contains(e.relatedTarget)) { zone.classList.remove("over"); placeholder.remove(); }
    });
    zone.addEventListener("drop", e => {
      e.preventDefault();
      if (!dragId) return;
      // 놓을 위치(순서) 계산: placeholder 앞에 있는 카드 수
      let index = 0;
      for (const el of zone.children) {
        if (el === placeholder) break;
        if (el.classList.contains("card") && !el.classList.contains("dragging")) index++;
      }
      moveMovie(dragId, zone.dataset.tier, index);
      clearPlaceholder();
    });
  });

  function findMovie(id) {
    for (const tier in state) {
      const i = state[tier].findIndex(m => m.id === id);
      if (i !== -1) return { tier, i };
    }
    return null;
  }

  function moveMovie(id, toTier, index) {
    const f = findMovie(id);
    if (!f) return;
    const [movie] = state[f.tier].splice(f.i, 1);
    state[toTier].splice(index, 0, movie);
    save(); render();
  }

  function removeMovie(id) {
    const f = findMovie(id);
    if (!f) return;
    state[f.tier].splice(f.i, 1);
    save(); render();
  }

  // ---------- 추가 / 되돌리기 ----------
  const inTitle = document.getElementById("inTitle");
  const inYear = document.getElementById("inYear");
  const inDirector = document.getElementById("inDirector");
  const msg = document.getElementById("msg");

  function addMovie() {
    const title = inTitle.value.trim();
    if (!title) { msg.textContent = "영화 제목을 입력해 주세요."; inTitle.focus(); return; }
    msg.textContent = "";
    state["미분류"].push({
      id: "u" + Date.now(),
      title,
      year: inYear.value.trim(),
      director: inDirector.value.trim()
    });
    inTitle.value = ""; inYear.value = ""; inDirector.value = "";
    save(); render(); inTitle.focus();
  }

  document.getElementById("btnAdd").addEventListener("click", addMovie);
  [inTitle, inYear, inDirector].forEach(el =>
    el.addEventListener("keydown", e => { if (e.key === "Enter") addMovie(); }));

  document.getElementById("btnReset").addEventListener("click", () => {
    if (!confirm("처음 상태(10편이 미분류 칸에 있는 상태)로 되돌릴까요?")) return;
    state = initialState();
    save(); render();
  });

  state = load();
  render();
</script>
</body>
</html>
